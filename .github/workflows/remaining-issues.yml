name: Remaining issue implementation

on:
  # Restricted to main. An unrestricted `push` plus `pull_request` ran the whole
  # 9-minute job twice for every commit on a PR branch and put two independent
  # marks on the same commit. Only the main-branch push can freeze evidence, so
  # nothing is lost by dropping the branch pushes.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_refreeze:
        description: >-
          Re-freeze the committed benchmark evidence on main even if the
          disparity gate failed. Use this only after reading the gate output and
          deciding the new numbers are correct; it overwrites the baseline the
          gate compares against.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  kmeans-parity:
    name: Canonical 19/19 KMeans parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve frozen disparity baseline
        run: |
          if [ -f benchmarks/disparity_report.json ]; then
            cp benchmarks/disparity_report.json /tmp/disparity_report.baseline.json
          fi
      - uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: 3f6031813912e8f77bcebe18c5b25dc35861216b
          path: .flow-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: |
          pip install -r .flow-toolchain/requirements.txt
          pip install -r benchmarks/requirements-architecture.txt
          sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Audit KMeans semantic divergence
        run: python benchmarks/audit_kmeans_semantics.py
      - name: Run repeated canonical benchmark
        env:
          FLOW_HEADLINE_COMMAND: ${{ github.workspace }}/.flow-toolchain/flow run benchmarks/bench_flow_v2.flow
          FLOW_HOST: python
          FLOW_OPT_LEVEL: "0"
          FLOW_LDFLAGS: "-lm -lopenblas"
          # Both sides call into OpenBLAS, and its thread count was left to
          # runtime detection. Pinned to 1 on a trial run, LogisticRegression on
          # digits lands at -1.88 log2 instead of the usual +1.08, which is the
          # anomalous mode this gate kept flagging on unrelated branches: the
          # library was sometimes deciding to run single-threaded. 4 is the vCPU
          # count of a standard ubuntu-latest runner and matches the regime the
          # committed baseline was measured in, so this fixes the value without
          # changing what the benchmark measures.
          OPENBLAS_NUM_THREADS: "4"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: python benchmarks/run_headline.py --repeats 5
      - name: Generate persistent disparity report
        run: |
          cp benchmarks/headline_summary.json benchmarks/headline_result_v2.json
          python benchmarks/generate_disparity_report.py
      - name: Gate disparity regressions and append history
        run: |
          if [ -f /tmp/disparity_report.baseline.json ]; then
            python benchmarks/check_disparity_regression.py \
              --baseline /tmp/disparity_report.baseline.json \
              --baseline-contract benchmarks/parity_contract.baseline.json \
              --current-contract benchmarks/parity_contract.json
          else
            python benchmarks/check_disparity_regression.py \
              --baseline /tmp/no-disparity-baseline.json \
              --baseline-contract benchmarks/parity_contract.baseline.json \
              --current-contract benchmarks/parity_contract.json
          fi
      - name: Require all 19 rows parity eligible and disparities retained
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('benchmarks/headline_summary.json').read_text())
          disparity = json.loads(Path('benchmarks/disparity_report.json').read_text())
          history = json.loads(Path('benchmarks/disparity_history.json').read_text())
          c = result['counts']
          assert c['total_rows'] == 19, c
          assert c['eligible_comparisons'] == 19, c
          assert c['parity_unresolved'] == 0, c
          assert c['measurement_unresolved'] == 0, c
          assert disparity['counts']['rows'] == 19, disparity['counts']
          assert disparity['counts']['rows_with_tracked_disparity'] > 0, disparity['counts']
          # Digits KMeans used to be promoted past a failed strict gate by
          # finalize_kmeans_parity.py, which is why this once required a
          # disagreement. Its seeded initialization now matches sklearn's, so
          # every row passes strictly and the two statuses agree everywhere.
          assert disparity['counts']['strict_final_status_disagreements'] == 0, disparity['counts']
          assert disparity['counts']['rows_with_semantic_difference'] > 0, disparity['counts']
          assert history['snapshots'], history
          print({'headline': c, 'disparity': disparity['counts'], 'history_snapshots': len(history['snapshots'])})
          PY
      - name: Advance parity contract baseline after successful gates
        run: cp benchmarks/parity_contract.json benchmarks/parity_contract.baseline.json
      # Uploaded even when the gate fails: a failing run is the one worth
      # reading, and without this its evidence was thrown away.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-19of19-${{ github.run_id }}
          path: |
            benchmarks/kmeans_semantics_audit.json
            benchmarks/sklearn_results_v2.txt
            benchmarks/flow_results_v2.txt
            benchmarks/headline_rows.json
            benchmarks/headline_summary.json
            benchmarks/headline_result_v2.json
            benchmarks/parity_diagnostics.json
            benchmarks/disparity_report.json
            benchmarks/disparity_history.json
            benchmarks/headline_environment.json
            benchmarks/parity_contract.baseline.json

  architecture-map:
    name: sklearn execution architecture map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned architecture dependencies
        run: pip install -r benchmarks/requirements-architecture.txt
      - name: Preserve committed inventory for drift detection
        run: |
          if [ -f benchmarks/sklearn_execution_inventory.json ]; then
            cp benchmarks/sklearn_execution_inventory.json /tmp/sklearn_execution_inventory.baseline.json
          fi
      - name: Generate execution, profiling and prioritization evidence
        run: python benchmarks/run_architecture_pipeline.py --profile-sizes 100,1000
      - name: Check estimator surface drift
        run: |
          if [ -f /tmp/sklearn_execution_inventory.baseline.json ]; then
            python benchmarks/check_architecture_drift.py /tmp/sklearn_execution_inventory.baseline.json benchmarks/sklearn_execution_inventory.json
          else
            echo 'No committed inventory baseline yet; this run establishes it.'
          fi
      - name: Validate inventory coverage and dispositions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inv = json.loads(Path('benchmarks/sklearn_execution_inventory.json').read_text())
          roadmap = json.loads(Path('benchmarks/optimization_roadmap.json').read_text())
          audit = json.loads(Path('benchmarks/native_hotspot_audit.json').read_text())
          amap = json.loads(Path('benchmarks/architecture_performance_map.json').read_text())
          assert len(inv['rows']) > 100, len(inv['rows'])
          assert len(roadmap['rows']) == len(inv['rows'])
          allowed = {'replace-with-flow','already-equivalent','retain-native','blocked-by-flow-compiler/runtime','low-value'}
          assert all(r['disposition'] in allowed for r in audit['rows'])
          assert amap['coverage']['headline_rows_with_substrate'] == 19, amap['coverage']
          assert amap['coverage']['headline_rows_with_speedup'] == 19, amap['coverage']
          assert amap['speedup_by_execution_substrate'], 'substrate/speedup grouping must not be empty'
          classes = {r['execution_class'] for r in inv['rows']}
          assert {'python-bound','mixed'} & classes
          print({'operations': len(inv['rows']), 'execution_classes': sorted(classes), 'native_hotspots': len(audit['rows'])})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-map-${{ github.run_id }}
          path: |
            benchmarks/sklearn_execution_inventory.json
            benchmarks/sklearn_execution_inventory.csv
            benchmarks/SKLEARN_EXECUTION_INVENTORY.md
            benchmarks/sklearn_runtime_attribution.json
            benchmarks/optimization_roadmap.json
            benchmarks/OPTIMIZATION_ROADMAP.md
            benchmarks/whole_estimator_experiments.json
            benchmarks/native_hotspot_audit.json
            benchmarks/NATIVE_HOTSPOT_AUDIT.md
            benchmarks/architecture_performance_map.json
            benchmarks/ARCHITECTURE_PERFORMANCE_MAP.md

  freeze-results:
    name: Freeze validated evidence on main
    # A failing gate does not re-freeze. The baseline is what the gate compares
    # against, so refreezing on failure would absorb any real regression into
    # the baseline within one push and the gate could never fire on it twice.
    # The escape hatch for an intentional change is the workflow_dispatch
    # force_refreeze input, which puts a human on the record instead.
    if: |
      !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.architecture-map.result == 'success'
      && (
        (github.event_name == 'push' && needs.kmeans-parity.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.force_refreeze)
      )
    needs: [kmeans-parity, architecture-map]
    # Concurrent pushes to main raced here and lost: the loser's `git push` was
    # rejected with `fetch first` and the whole workflow went red on main
    # without any gate having failed. Serialize the job and rebase before push.
    concurrency:
      group: freeze-benchmark-evidence
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the push retry below can rebase onto origin/main.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: canonical-19of19-${{ github.run_id }}
          path: benchmarks
      - uses: actions/download-artifact@v4
        with:
          name: architecture-map-${{ github.run_id }}
          path: benchmarks
      - name: Promote canonical summary to published source of truth
        run: cp benchmarks/headline_summary.json benchmarks/headline_result_v2.json
      - name: Sync published claims to the frozen artifact
        run: python benchmarks/validate_published_claims.py --fix
      - name: Commit generated evidence if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/ README.md
          if git diff --cached --quiet; then
            echo 'Generated evidence already current.'
            exit 0
          fi
          git commit -m "Freeze validated benchmark, disparity history, and architecture evidence [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase origin/main
          done
          echo 'Could not push frozen evidence after 3 attempts.'
          exit 1
