name: Flow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-imports:
    name: FLOW syntax and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: 3f6031813912e8f77bcebe18c5b25dc35861216b
          path: .flow-toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse sources and validate imports
        env:
          PYTHONPATH: ${{ github.workspace }}/.flow-toolchain/src
        run: python .github/scripts/verify_flow_sources.py

      - name: Audit published benchmark timing units
        run: |
          python benchmarks/normalize_published_timings.py
          python benchmarks/validate_published_timings.py

      - name: Validate benchmark contracts and fixtures
        run: |
          python -m pip install numpy
          python benchmarks/fixtures.py
          python benchmarks/verify_fixtures.py
          python benchmarks/test_generate_headline_summary.py
          python benchmarks/publish_headline_v2.py --check
          python benchmarks/validate_execution_substrate.py
          python -m py_compile \
            benchmarks/timing.py \
            benchmarks/fixtures.py \
            benchmarks/verify_fixtures.py \
            benchmarks/bench_sklearn_v2.py \
            benchmarks/compare_v2.py \
            benchmarks/run_headline.py \
            benchmarks/bench_scaled_sklearn.py \
            benchmarks/compare_scaled.py \
            benchmarks/scaled_flow_to_json.py \
            benchmarks/aggregate_scaled_flow.py \
            benchmarks/check_flow_regression.py \
            benchmarks/publish_headline_v2.py \
            benchmarks/validate_execution_substrate.py
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('benchmarks/parity_contract.json').read_text())
          rows = contract['rows']
          assert len(rows) == 19, len(rows)
          assert len({(r['algorithm'], r['dataset'], r['metric']) for r in rows}) == 19
          assert all(r['category'] in {'supervised', 'clustering', 'decomposition'} for r in rows)
          print('benchmark contract: 19 unique rows OK')
          PY

  run-all:
    name: Run all tests and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: 3f6031813912e8f77bcebe18c5b25dc35861216b
          path: .flow-toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flow compiler deps
        run: pip install -r .flow-toolchain/requirements.txt

      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Run tests and examples
        env:
          FLOW_BIN: ${{ github.workspace }}/.flow-toolchain/flow
          FLOW_HOST: python
          FLOW_OPT_LEVEL: "0"
          FLOW_LDFLAGS: "-lm -lopenblas"
        run: python tools/run_all.py

  benchmark-contract:
    name: Canonical benchmark contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: 3f6031813912e8f77bcebe18c5b25dc35861216b
          path: .flow-toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: |
          pip install -r .flow-toolchain/requirements.txt
          pip install numpy scikit-learn
          sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Run repeated canonical benchmark and parity gate
        env:
          FLOW_HOST: python
          FLOW_OPT_LEVEL: "0"
          FLOW_LDFLAGS: "-lm -lopenblas"
          FLOW_HEADLINE_COMMAND: ${{ github.workspace }}/.flow-toolchain/flow run benchmarks/bench_flow_v2.flow
        run: python benchmarks/run_headline.py --repeats 5

      - uses: actions/upload-artifact@v4
        with:
          name: headline-benchmark-${{ github.run_id }}
          path: |
            benchmarks/sklearn_results_v2.txt
            benchmarks/flow_results_v2.txt
            benchmarks/headline_rows.json
            benchmarks/headline_summary.json
            benchmarks/parity_diagnostics.json
            benchmarks/headline_environment.json

  scaled-report:
    name: Scaled benchmark report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: 3f6031813912e8f77bcebe18c5b25dc35861216b
          path: .flow-toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: |
          pip install -r .flow-toolchain/requirements.txt
          pip install numpy scikit-learn
          sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Run scaled sklearn matrix through 10k rows
        run: python benchmarks/bench_scaled_sklearn.py --max-rows 10000 --output benchmarks/scaled_sklearn.json

      - name: Run repeated scaled Flow matrix through 10k rows
        env:
          FLOW_HOST: python
          FLOW_OPT_LEVEL: "0"
          FLOW_LDFLAGS: "-lm -lopenblas"
        run: |
          rm -f benchmarks/scaled_flow_samples.txt
          for repeat in 1 2 3; do
            ${{ github.workspace }}/.flow-toolchain/flow run benchmarks/bench_scaled.flow >> benchmarks/scaled_flow_samples.txt
          done
          python benchmarks/aggregate_scaled_flow.py benchmarks/scaled_flow_samples.txt benchmarks/scaled_flow.txt

      - name: Normalize Flow matrix
        run: python benchmarks/scaled_flow_to_json.py benchmarks/scaled_flow.txt benchmarks/scaled_flow.json

      - name: Generate non-blocking competitive report
        run: python benchmarks/compare_scaled.py benchmarks/scaled_flow.txt benchmarks/scaled_sklearn.json --output benchmarks/scaled_comparison.json

      - name: Gate Flow against committed self baseline
        run: python benchmarks/check_flow_regression.py benchmarks/scaled_flow.json benchmarks/scaled_flow_baseline.json

      - uses: actions/upload-artifact@v4
        with:
          name: scaled-benchmark-${{ github.run_id }}
          path: |
            benchmarks/scaled_sklearn.json
            benchmarks/scaled_flow_samples.txt
            benchmarks/scaled_flow.txt
            benchmarks/scaled_flow.json
            benchmarks/scaled_comparison.json

  python-package:
    name: Python native package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: 3f6031813912e8f77bcebe18c5b25dc35861216b
          path: .flow-toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install -r .flow-toolchain/requirements.txt
          python -m pip install numpy pytest setuptools wheel
          sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Build native wheel
        run: python tools/build_python_package.py --flow-root .flow-toolchain

      - name: Install wheel and run Python API tests
        run: |
          python -m pip install --force-reinstall --no-deps dist/flow_scikit-*.whl
          python -m pytest -q python/tests

      - uses: actions/upload-artifact@v4
        with:
          name: flow-scikit-wheel-${{ github.run_id }}
          path: dist/*.whl
