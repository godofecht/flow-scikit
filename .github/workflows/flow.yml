name: Flow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repairs:
    name: Apply estimator repairs
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/ci-red-suite-20260816'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-red-suite-20260816
      - name: Apply source repairs
        run: python tools/apply_ci_repairs.py
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/scikit/svm.flow lib/scikit/mixture.flow tests/test_sparse_estimators.flow
          git commit -m "fix: repair SVC, GMM, and sparse logistic tests"
          git push origin HEAD:fix/ci-red-suite-20260816

  syntax-and-imports:
    name: FLOW syntax and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: 3f6031813912e8f77bcebe18c5b25dc35861216b
          path: .flow-toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse sources and validate imports
        env:
          PYTHONPATH: ${{ github.workspace }}/.flow-toolchain/src
        run: python .github/scripts/verify_flow_sources.py

  run-all:
    name: Run failing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: 3f6031813912e8f77bcebe18c5b25dc35861216b
          path: .flow-toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flow compiler deps
        run: pip install -r .flow-toolchain/requirements.txt

      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Run remaining failing tests
        env:
          FLOW_BIN: ${{ github.workspace }}/.flow-toolchain/flow
          FLOW_HOST: python
          FLOW_OPT_LEVEL: "0"
          FLOW_LDFLAGS: "-lm -lopenblas"
        run: |
          failed=0
          for file in tests/test_new_features.flow tests/test_new_modules_v2.flow tests/test_sparse_estimators.flow; do
            echo "===== $file ====="
            "$FLOW_BIN" run "$file" || failed=1
          done
          exit "$failed"
