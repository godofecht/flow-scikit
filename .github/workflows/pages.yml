name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'benchmarks/**'
      - 'lib/scikit/metrics_binary.flow'
      - 'tools/build_browser_wasm.py'
      - 'tools/smoke_browser_wasm.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: 3f8035873185c4a2cae0828b32ea9aeffaad3b38
          path: .flow-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Flow compiler dependencies
        run: pip install -r .flow-toolchain/requirements.lock
      - name: Install direct wasm32 toolchain
        uses: ./.flow-toolchain/.github/actions/install-toolchain
        with:
          mlir: 'true'
      - name: Build direct MLIR WebAssembly browser runtime
        run: python tools/build_browser_wasm.py --flow-repo .flow-toolchain
      - name: Smoke direct browser WebAssembly API
        run: node tools/smoke_browser_wasm.mjs docs/wasm/browser_mlir.wasm
      - name: Regenerate canonical disparity evidence
        run: python benchmarks/generate_disparity_report.py
      - name: Materialize disparity history for this Pages build
        run: python benchmarks/check_disparity_regression.py --baseline /tmp/no-disparity-baseline.json --commit "${GITHUB_SHA}"
      - name: Publish canonical benchmark, disparity, history and architecture evidence
        run: python benchmarks/publish_headline_v2.py
      - name: Normalize legacy sklearn timings to milliseconds
        run: python benchmarks/normalize_published_timings.py
      - name: Validate published benchmark timing units
        run: python benchmarks/validate_published_timings.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
