name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: [docs/**, benchmarks/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate canonical v2 benchmark headline
        run: python benchmarks/publish_headline_v2.py
      - name: Normalize legacy sklearn timings to milliseconds
        run: python benchmarks/normalize_published_timings.py
      - name: Validate published benchmark timing units
        run: python benchmarks/validate_published_timings.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
