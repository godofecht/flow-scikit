name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build recorded browser demos
        run: |
          python -m pip install --disable-pip-version-check pillow playwright
          python -m playwright install --with-deps chromium
          python -m http.server 4173 -d docs >/tmp/flow-scikit-docs.log 2>&1 &
          python tools/record_browser_demos.py http://127.0.0.1:4173 docs/assets/recordings
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
