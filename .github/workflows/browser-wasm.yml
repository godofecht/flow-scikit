name: Direct browser wasm

on:
  push:
    paths:
      - 'docs/wasm/**'
      - 'lib/scikit/metrics.flow'
      - 'lib/scikit/metrics_binary.flow'
      - 'tools/build_browser_wasm.py'
      - 'tools/smoke_browser_wasm.mjs'
      - '.github/workflows/browser-wasm.yml'
  pull_request:
    paths:
      - 'docs/wasm/**'
      - 'lib/scikit/metrics.flow'
      - 'lib/scikit/metrics_binary.flow'
      - 'tools/build_browser_wasm.py'
      - 'tools/smoke_browser_wasm.mjs'
      - '.github/workflows/browser-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: 3f8035873185c4a2cae0828b32ea9aeffaad3b38
          path: .flow-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Flow compiler dependencies
        run: pip install -r .flow-toolchain/requirements.lock
      - name: Install direct wasm32 toolchain
        uses: ./.flow-toolchain/.github/actions/install-toolchain
        with:
          mlir: 'true'
      - name: Build browser module directly from Flow
        run: python tools/build_browser_wasm.py --flow-repo .flow-toolchain
      - name: Execute browser API under Node WebAssembly
        run: node tools/smoke_browser_wasm.mjs docs/wasm/browser_mlir.wasm
