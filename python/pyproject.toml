[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-scikit"
version = "0.2.0"
description = "Low-latency Python bindings for flow-scikit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
